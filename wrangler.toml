name = 'prepwiseinfo'
main = "worker/index.js"
compatibility_date = "2026-04-05"

[assets]
directory = "./landing/out"
binding = "ASSETS"
# The worker sees everything so it can 301 the apex to the canonical www host
# (see worker/index.js), and it still renders the /r/* recipe-share previews.
#
# /.well-known/* is EXEMPTED AT THE ROUTING LAYER, on purpose. Apple requires
# the apple-app-site-association to be served from the exact host in the link
# with NO redirect, and the iOS app registers applinks:prepwise-app.com (the
# APEX). Routing it straight to the asset worker means no worker code path can
# redirect it, rewrite it, or take Universal Links down by throwing.
run_worker_first = ["/*", "!/.well-known/*"]
