name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must stay >= 22: wrangler 4.x refuses to run on anything older
          # ("Wrangler requires at least Node.js v22.0.0"), and the wrangler
          # version pin below is load-bearing for the apex redirect. Next 16
          # needs >= 20.9, so 22 satisfies both. Keep landing/.nvmrc in step.
          node-version: 22

      - name: Install & build
        working-directory: landing
        env:
          NEXT_PUBLIC_BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          # Meta Pixel ID is public (it ships in client-side JS), so it's fine inline.
          NEXT_PUBLIC_META_PIXEL_ID: "1773365026987238"
          # GA4 Measurement ID is public (ships in client-side JS), so it's fine inline.
          NEXT_PUBLIC_GA_MEASUREMENT_ID: "G-GD15ZM4ZPM"
        run: |
          npm ci
          npm run build

      - name: Run worker unit tests
        run: node worker/apex-redirect.test.mjs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # PINNED, and it must stay >= 4.x.
          #
          # wrangler-action@v3 defaults to wrangler 3.90.0, which does not know
          # the `assets.run_worker_first` field. It does not fail on it: it logs
          # `Unexpected fields found in assets field: "run_worker_first"` as a
          # WARNING and deploys anyway with the field DROPPED. The deploy goes
          # green and the routing config simply is not there.
          #
          # That silently reverted the apex -> www redirect on 2026-07-26: every
          # path that existed as a static asset was served by the asset worker
          # and never reached our code, so only non-asset paths redirected. The
          # pre-existing ["/r/*"] rule had been inert for the same reason since
          # the day it was written; /r/* only worked because a share id is not a
          # static asset, so the default fallback ran the worker anyway.
          wranglerVersion: "4.114.0"

      # The deploy step above cannot fail on a dropped config field, so assert
      # the invariants against the LIVE site instead. Each of these fails
      # silently in production if it regresses: a redirect on /.well-known/ or
      # /r/ breaks recipe-share Universal Links on phones we never see, and a
      # missing apex redirect quietly re-splits the ranking signal.
      - name: Verify live routing invariants
        run: bash scripts/verify-live-routing.sh
